name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Python syntax check
        run: python -m py_compile backend/app.py scripts/import_polling_units.py scripts/fetch_inec_polling_units.py tests/test_app.py tests/conftest.py
      - name: Frontend syntax check
        run: node --check app.js && node --check sw.js
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
